      document.documentElement.dataset.theme = t;

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menyuni ochish" aria-controls="sidebar" aria-expanded="false">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Bosh sahifa">
      <span class="brand-mark"><svg class="ic"><use href="#i-logo"/></svg></span>
      <span class="brand-name">Laravel Skill Map<small>senior · php · laravel</small></span>
    </a>
    <div class="topbar-spacer"></div>
    <button class="search-trigger" id="search-trigger" aria-label="Qidirish (Ctrl+K)">
      <svg class="ic"><use href="#i-search"/></svg>
      <span>Skill yoki mavzu qidiring…</span>
      <span class="kbds"><kbd>Ctrl</kbd><kbd>K</kbd></span>
    </button>
    <button class="icon-btn theme-btn" id="theme-btn" aria-label="Mavzuni almashtirish">
      <svg class="ic ic-sun"><use href="#i-sun"/></svg>
      <svg class="ic ic-moon"><use href="#i-moon"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="icon-btn" id="more-btn" aria-label="Qo'shimcha amallar" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
        <svg class="ic"><use href="#i-more"/></svg>
      </button>
      <div class="dropdown" id="more-menu" role="menu">
        <button role="menuitem" data-action="link-file" id="menu-link"><svg class="ic"><use href="#i-link"/></svg><span class="menu-link-text">progress.json fayliga ulash</span></button>
        <button role="menuitem" data-action="unlink-file" id="menu-unlink" style="display:none"><svg class="ic"><use href="#i-trash"/></svg>Fayl aloqasini uzish</button>
        <hr />
        <button role="menuitem" data-action="export"><svg class="ic"><use href="#i-download"/></svg>Progressni eksport (JSON)</button>
        <label role="menuitem" tabindex="0"><svg class="ic"><use href="#i-upload"/></svg>Progressni import qilish
          <input type="file" id="import-input" accept="application/json,.json" class="sr-only" />
        </label>
        <hr />
        <button role="menuitem" data-action="reset" class="danger"><svg class="ic"><use href="#i-trash"/></svg>Progressni tozalash</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Skill'lar"></nav>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <div class="view" id="view" tabindex="-1">
        <div class="loading"><div class="spinner"></div>Ma'lumotlar yuklanmoqda…</div>
      </div>
    </main>
  </div>

  <!-- Command palette -->
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Qidiruv">
    <div class="palette-box">
      <div class="palette-input">
        <svg class="ic ic-lg"><use href="#i-search"/></svg>
        <input id="palette-input" type="search" placeholder="Masalan: N+1, Sanctum, EXPLAIN, idempotency…" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list" />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-results" id="palette-results" role="listbox"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> tanlash</span>
        <span><kbd>Enter</kbd> ochish</span>
        <span><kbd>Esc</kbd> yopish</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><svg class="ic"><use href="#i-check"/></svg><span></span></div>

  <script src="data/manifest.js"></script>
  <script src="data/interview-questions.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
